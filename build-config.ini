# JoF EternalJK Build Configuration
# This file contains default build settings that can be customized

[General]
# Default target platform (win64, win32, linux)
default_target = win64

# Default build configuration (Release, Debug, RelWithDebInfo)
default_config = Release

# Default Visual Studio generator
visual_studio_generator = Visual Studio 16 2019

[CMakeOptions]
# Build options (set to ON/OFF)
BuildMPEngine = ON
BuildMPRdVanilla = ON
BuildMPDed = ON
BuildMPGame = ON
BuildMPCGame = ON
BuildMPUI = ON
BuildMPRend2 = ON
BuildPortableVersion = ON
BuildDiscordRichPresence = ON

# Library options (set to ON/OFF, or leave empty for auto-detection)
UseInternalOpenAL =
UseInternalZlib =
UseInternalPNG =
UseInternalJPEG =
UseInternalSDL2 =

[Paths]
# Custom install prefix (leave empty for default)
install_prefix =

# Custom build directory prefix
build_dir_prefix = build

[Advanced]
# Additional CMake arguments (one per line)
# cmake_args =
# -DCMAKE_VERBOSE_MAKEFILE=ON
# -DCMAKE_EXPORT_COMPILE_COMMANDS=ON